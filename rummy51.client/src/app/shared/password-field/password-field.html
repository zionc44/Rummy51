<app-form-field [controlId]="controlId()" [label]="label()" [error]="error()">
  <!-- ltr on the wrapper so the reveal button follows the text rather than
       covering its first characters. -->
  <div class="password-field" dir="ltr">
    <input
      [id]="controlId()"
      [type]="visible() ? 'text' : 'password'"
      [formControl]="control()"
      [autocomplete]="autocomplete()"
      class="field-input field-input--with-action"
    />
    <app-password-visibility-toggle [(visible)]="visible" />
  </div>
</app-form-field>
