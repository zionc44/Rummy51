<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="password-form">
  <p class="password-form__note">
    {{ (hasPassword() ? 'account.passwordChangeNote' : 'account.passwordSetNote') | translate }}
  </p>

  @if (hasPassword()) {
    <app-password-field
      [control]="form.controls.currentPassword"
      controlId="currentPassword"
      label="account.currentPassword"
      autocomplete="current-password"
      [codes]="currentPasswordCodes"
    />
  }

  <app-password-field
    [control]="form.controls.newPassword"
    controlId="newPassword"
    label="account.newPassword"
    autocomplete="new-password"
    [codes]="newPasswordCodes"
  />

  @if (saved()) {
    <p class="password-form__saved">{{ 'account.passwordSaved' | translate }}</p>
  }

  <app-error-messages [errors]="submission.errors()" />

  <button type="submit" [disabled]="submission.submitting()" class="btn-primary password-form__submit">
    {{ (submission.submitting() ? 'account.saving' : 'account.save') | translate }}
  </button>
</form>
