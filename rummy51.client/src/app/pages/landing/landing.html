<app-page-shell>
  <main class="landing">
    <p class="landing__suits" aria-hidden="true">
      <span>&spades;</span>
      <span class="landing__suit--red">&hearts;</span>
      <span class="landing__suit--red">&diams;</span>
      <span>&clubs;</span>
    </p>

    <h1 class="landing__title">{{ 'app.title' | translate }}</h1>

    <p class="landing__tagline">{{ 'app.tagline' | translate }}</p>

    <p class="landing__intro">{{ 'landing.intro' | translate }}</p>

    <div class="landing__actions">
      <a routerLink="/register" class="btn-primary">{{ 'landing.register' | translate }}</a>
      <a routerLink="/login" class="btn-ghost">{{ 'landing.login' | translate }}</a>
    </div>
  </main>
</app-page-shell>
