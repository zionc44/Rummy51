<app-page-shell>
  <main class="auth">
    <div class="auth__card">
      <h1 class="auth__title">{{ 'auth.registerTitle' | translate }}</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth__form">
        <app-form-field
          controlId="displayName"
          label="auth.displayName"
          hint="auth.displayNameHint"
          [error]="displayNameError()"
        >
          <input
            id="displayName"
            type="text"
            formControlName="displayName"
            autocomplete="nickname"
            class="field-input"
          />
        </app-form-field>

        <app-form-field controlId="email" label="auth.email" [error]="emailError()">
          <!-- ltr because an address reads left to right even on an rtl page. -->
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            dir="ltr"
            class="field-input"
          />
        </app-form-field>

        <app-password-field
          [control]="form.controls.password"
          controlId="password"
          autocomplete="new-password"
          [codes]="passwordCodes"
        />

        <app-error-messages [errors]="submission.errors()" />

        <button type="submit" [disabled]="submission.submitting()" class="btn-primary auth__submit">
          {{ (submission.submitting() ? 'auth.registerPending' : 'auth.registerSubmit') | translate }}
        </button>
      </form>

      <app-google-sign-in-button />

      <p class="auth__switch">
        {{ 'auth.haveAccount' | translate }}
        <a routerLink="/login" class="auth__link">{{ 'landing.login' | translate }}</a>
      </p>
    </div>
  </main>
</app-page-shell>
