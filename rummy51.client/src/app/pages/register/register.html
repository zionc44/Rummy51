<app-page-shell>
  <main class="flex flex-1 items-center justify-center px-4 pb-12">
    <div class="w-full max-w-sm">
      <h1 class="mb-8 text-center text-3xl font-black">{{ 'auth.registerTitle' | translate }}</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-5">
        <app-form-field
          controlId="displayName"
          label="auth.displayName"
          hint="auth.displayNameHint"
          [error]="displayNameError()"
        >
          <input
            id="displayName"
            type="text"
            formControlName="displayName"
            autocomplete="nickname"
            class="field-input"
          />
        </app-form-field>

        <app-form-field controlId="email" label="auth.email" [error]="emailError()">
          <!-- ltr because an address reads left to right even on an rtl page. -->
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            dir="ltr"
            class="field-input text-start"
          />
        </app-form-field>

        <app-form-field controlId="password" label="auth.password" [error]="passwordError()">
          <!-- The wrapper is ltr so the reveal button follows the text rather
               than covering its first characters. -->
          <div class="relative" dir="ltr">
            <input
              id="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
              class="field-input pe-12 text-start"
            />
            <app-password-visibility-toggle [(visible)]="passwordVisible" />
          </div>
        </app-form-field>

        <app-error-messages [errors]="serverErrors()" />

        <button type="submit" [disabled]="submitting()" class="btn-primary mt-2">
          {{ (submitting() ? 'auth.registerPending' : 'auth.registerSubmit') | translate }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-white/50">
        {{ 'auth.haveAccount' | translate }}
        <a routerLink="/login" class="ms-1 font-medium text-felt-500 underline underline-offset-4">
          {{ 'landing.login' | translate }}
        </a>
      </p>
    </div>
  </main>
</app-page-shell>
