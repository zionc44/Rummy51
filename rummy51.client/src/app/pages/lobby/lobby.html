<app-page-shell>
  <app-profile-menu shell-actions />

  <main class="lobby">
    @if (lobby.signedInElsewhere()) {
      <!-- Not an error: the same account opened the lobby somewhere else, and
           one player holds one connection. Taking it back is a button away. -->
      <div class="lobby__replaced">
        <h1 class="lobby__replaced-title">{{ 'lobby.replacedTitle' | translate }}</h1>
        <p class="lobby__replaced-body">{{ 'lobby.replacedBody' | translate }}</p>
        <button type="button" class="btn-primary" (click)="reconnect()">
          {{ 'lobby.reconnect' | translate }}
        </button>
      </div>
    } @else {
      <app-seated-notice />

      <div class="lobby__body">
        <app-online-players
          class="lobby__players"
          [players]="lobby.onlinePlayers()"
          [currentPlayerId]="auth.currentPlayer()?.playerId ?? null"
        />

        <app-table-lists class="lobby__tables" />
      </div>
    }
  </main>
</app-page-shell>
