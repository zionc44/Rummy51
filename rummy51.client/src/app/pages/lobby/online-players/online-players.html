<section class="players">
  <h2 class="players__title">{{ 'lobby.players' | translate }} · {{ rows().length }}</h2>

  <ul class="players__list">
    @for (row of rows(); track row.playerId) {
      <li class="players__row" [class.players__row--self]="row.isSelf">
        <span class="players__avatar" [class]="'players__avatar--' + row.status" aria-hidden="true">
          {{ row.initials }}
        </span>

        <span class="players__who">
          <span class="players__name">{{ row.displayName }}</span>
          <span class="players__status">{{ 'lobby.status.' + row.status | translate }}</span>
        </span>
      </li>
    }
  </ul>
</section>
