<div class="row" [class.row--playing]="table().started" [class.row--mine]="mine()">
  <div class="row__seats">
    @for (seat of table().seats; track $index) {
      @if (seat.playerId) {
        <app-player-avatar
          class="row__seat"
          [class.row__seat--away]="seat.away"
          [displayName]="seat.displayName ?? ''"
          [avatarUrl]="seat.avatarUrl"
        />
      } @else {
        <span class="row__seat row__seat--empty"></span>
      }
    }
  </div>

  <span class="row__detail">
    @if (detail(); as detail) {
      {{ detail.key | translate: detail.amount }}
    }
  </span>

  <!-- Absent rather than zero: no jokers is the quieter fact of the two. -->
  @if (table().jokers; as jokers) {
    <span
      class="row__jokers"
      [attr.aria-label]="'lobby.withJokers' | translate: { '0': jokers }"
    >
      <img class="row__joker" src="cards/J-01.svg" alt="" width="17" height="24" />
      ×{{ jokers }}
    </span>
  }

  @if (mine()) {
    <button
      type="button"
      class="row__return"
      [attr.aria-label]="'lobby.backToTable' | translate"
      [attr.title]="'lobby.backToTable' | translate"
      (click)="returned.emit(table().tableId)"
    >
      <app-icon-return />
    </button>
  } @else if (table().started) {
    <span class="row__state">{{ 'lobby.inPlay' | translate }}</span>
  } @else {
    <button
      type="button"
      class="row__join"
      [disabled]="!canJoin()"
      [attr.aria-label]="'lobby.join' | translate"
      [attr.title]="'lobby.join' | translate"
      (click)="joined.emit(table().tableId)"
    >
      <app-icon-join />
    </button>
  }
</div>
