<section class="tables">
  <header class="tables__header">
    <h2 class="tables__heading">{{ 'lobby.tables' | translate }}</h2>

    <button
      type="button"
      class="btn-primary tables__create"
      [disabled]="seatedAt() !== null"
      (click)="creating.set(true)"
    >
      {{ 'lobby.newTable' | translate }}
    </button>
  </header>

  <app-error-messages [errors]="errors()" />

  <div class="tables__tabs" role="tablist">
    @for (mode of modes; track mode) {
      <button
        type="button"
        role="tab"
        class="tab"
        [class.tab--open]="mode === openMode()"
        [attr.aria-selected]="mode === openMode()"
        [attr.aria-label]="'lobby.modes.' + mode | translate"
        (click)="openMode.set(mode)"
      >
        <app-mode-icon class="tab__icon" [mode]="mode" />
        <span class="tab__label">{{ 'lobby.modes.' + mode | translate }}</span>
        <span class="tab__count">{{ counts()[mode] }}</span>
      </button>
    }
  </div>

  <div class="tables__lists">
    @for (mode of modes; track mode) {
      <app-table-list
        class="tables__list"
        [class.tables__list--open]="mode === openMode()"
        [mode]="mode"
        [tables]="byMode()[mode]"
        [seatedAt]="seatedAt()"
        (joined)="join($event)"
      />
    }
  </div>
</section>

@if (creating()) {
  <app-new-table (created)="create($event)" (cancelled)="creating.set(false)" />
}
