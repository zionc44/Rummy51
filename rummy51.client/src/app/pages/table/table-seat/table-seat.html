@if (seat().playerId) {
  <span class="seat__who">
    <app-player-avatar
      class="seat__avatar"
      [displayName]="seat().displayName ?? ''"
      [avatarUrl]="seat().avatarUrl"
    />
    @if (dealer()) {
      <span class="seat__dealer">{{ 'table.dealer' | translate }}</span>
    }
    <span class="seat__name" [class.seat__name--mine]="mine()">{{ seat().displayName }}</span>
  </span>
  @if (held().length) {
    <div class="seat__held">
      <!-- A place for every card, filled or still on its way, so the row is
           already the width it will be and nothing shifts as they land. -->
      @for (code of held(); track $index) {
        @if (code) {
          <img #landing class="seat__card" [src]="'cards/' + code + '.svg'" alt="" />
        } @else {
          <span #landing class="seat__card"></span>
        }
      }
    </div>
  }
} @else {
  <span class="seat__who">
    <span class="seat__waiting" [attr.aria-label]="'table.emptySeat' | translate"></span>
    <span class="seat__name seat__name--empty">{{ 'table.emptySeat' | translate }}</span>
  </span>
}
