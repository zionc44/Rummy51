<div class="standing">
  <div class="standing__panel" role="dialog" aria-modal="true">
    <p class="standing__title">
      {{ 'table.standing' | translate }}

      @if (progress(); as progress) {
        <span class="standing__limit">{{ progress.key | translate: progress.params }}</span>
      }
    </p>

    <div class="standing__pad">
      <app-score-pad [columns]="pad().columns" [rows]="pad().rows" />
    </div>

    <button type="button" class="btn-primary standing__ok" (click)="closed.emit()">
      {{ 'common.ok' | translate }}
    </button>
  </div>
</div>
