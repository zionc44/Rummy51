<div class="standing">
  <div class="standing__panel" role="dialog" aria-modal="true">
    <p class="standing__title">
      {{ 'table.standing' | translate }}

      @if (limit(); as limit) {
        <span class="standing__limit">{{ 'lobby.points' | translate: { '0': limit } }}</span>
      }
    </p>

    <div class="standing__pad">
      <app-score-pad [columns]="pad().columns" [rows]="pad().rows" />
    </div>

    <button type="button" class="btn-primary" (click)="closed.emit()">
      {{ 'common.ok' | translate }}
    </button>
  </div>
</div>
