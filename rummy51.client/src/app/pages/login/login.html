<app-page-shell>
  <main class="auth">
    <div class="auth__card">
      <h1 class="auth__title">{{ 'auth.loginTitle' | translate }}</h1>

      @if (registered()) {
        <p class="auth__notice">{{ 'auth.registered' | translate }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth__form">
        <app-form-field controlId="email" label="auth.email" [error]="emailError()">
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            dir="ltr"
            class="field-input"
          />
        </app-form-field>

        <app-form-field controlId="password" label="auth.password" [error]="passwordError()">
          <div class="auth__password" dir="ltr">
            <input
              id="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              class="field-input field-input--with-action"
            />
            <app-password-visibility-toggle [(visible)]="passwordVisible" />
          </div>
        </app-form-field>

        <label class="auth__remember">
          <input type="checkbox" formControlName="rememberMe" class="auth__checkbox" />
          {{ 'auth.rememberMe' | translate }}
        </label>

        <app-error-messages [errors]="serverErrors()" />

        <button type="submit" [disabled]="submitting()" class="btn-primary auth__submit">
          {{ (submitting() ? 'auth.loginPending' : 'auth.loginSubmit') | translate }}
        </button>
      </form>

      <app-google-sign-in-button />

      <p class="auth__switch">
        {{ 'auth.noAccount' | translate }}
        <a routerLink="/register" class="auth__link">{{ 'landing.register' | translate }}</a>
      </p>
    </div>
  </main>
</app-page-shell>
