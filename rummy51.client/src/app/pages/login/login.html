<app-page-shell>
  <main class="auth">
    <div class="auth__card">
      <h1 class="auth__title">{{ 'auth.loginTitle' | translate }}</h1>

      @if (registered()) {
        <p class="auth__notice">{{ 'auth.registered' | translate }}</p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth__form">
        <app-form-field controlId="email" label="auth.email" [error]="emailError()">
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            dir="ltr"
            class="field-input"
          />
        </app-form-field>

        <app-password-field [control]="form.controls.password" controlId="password" />

        <label class="auth__remember">
          <input type="checkbox" formControlName="rememberMe" class="auth__checkbox" />
          {{ 'auth.rememberMe' | translate }}
        </label>

        <app-error-messages [errors]="errors()" />

        <button type="submit" [disabled]="submission.submitting()" class="btn-primary auth__submit">
          {{ (submission.submitting() ? 'auth.loginPending' : 'auth.loginSubmit') | translate }}
        </button>
      </form>

      <app-google-sign-in-button />

      <p class="auth__switch">
        {{ 'auth.noAccount' | translate }}
        <a routerLink="/register" class="auth__link">{{ 'landing.register' | translate }}</a>
      </p>
    </div>
  </main>
</app-page-shell>
