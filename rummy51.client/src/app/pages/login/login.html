<app-page-shell>
  <main class="flex flex-1 items-center justify-center px-4 pb-12">
    <div class="w-full max-w-sm">
      <h1 class="mb-8 text-center text-3xl font-black">{{ 'auth.loginTitle' | translate }}</h1>

      @if (registered()) {
        <p class="mb-6 rounded-lg border border-felt-500/40 bg-felt-500/10 px-4 py-3 text-sm text-felt-50">
          {{ 'auth.registered' | translate }}
        </p>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-5">
        <app-form-field controlId="email" label="auth.email" [error]="emailError()">
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            dir="ltr"
            class="field-input text-start"
          />
        </app-form-field>

        <app-form-field controlId="password" label="auth.password" [error]="passwordError()">
          <div class="relative" dir="ltr">
            <input
              id="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              class="field-input pe-12 text-start"
            />
            <app-password-visibility-toggle [(visible)]="passwordVisible" />
          </div>
        </app-form-field>

        <label class="flex cursor-pointer items-center gap-2.5 text-sm text-white/70">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="size-4 rounded border-white/30 bg-white/10 accent-felt-500"
          />
          {{ 'auth.rememberMe' | translate }}
        </label>

        <app-error-messages [errors]="serverErrors()" />

        <button type="submit" [disabled]="submitting()" class="btn-primary mt-2">
          {{ (submitting() ? 'auth.loginPending' : 'auth.loginSubmit') | translate }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-white/50">
        {{ 'auth.noAccount' | translate }}
        <a routerLink="/register" class="ms-1 font-medium text-felt-500 underline underline-offset-4">
          {{ 'landing.register' | translate }}
        </a>
      </p>
    </div>
  </main>
</app-page-shell>
