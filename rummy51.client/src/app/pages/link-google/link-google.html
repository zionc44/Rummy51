<app-page-shell>
  <main class="auth">
    <div class="auth__card">
      <h1 class="auth__title">{{ 'auth.linkGoogleTitle' | translate }}</h1>

      <p class="auth__intro">
        {{ 'auth.linkGoogleBody' | translate: { '0': email() } }}
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="auth__form">
        <app-password-field [control]="form.controls.password" controlId="password" />

        <app-error-messages [errors]="submission.errors()" />

        <button type="submit" [disabled]="submission.submitting()" class="btn-primary auth__submit">
          {{ (submission.submitting() ? 'auth.linkGooglePending' : 'auth.linkGoogleSubmit') | translate }}
        </button>
      </form>

      <p class="auth__switch">
        <a routerLink="/login" class="auth__link">{{ 'auth.back' | translate }}</a>
      </p>
    </div>
  </main>
</app-page-shell>
